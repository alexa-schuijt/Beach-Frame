<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seamless Video Loop</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video" autoplay muted playsinline preload="auto">
        <source src="bea.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");

        // 🔥 TUNE THESE TWO VALUES
        const LOOP_START = 0.2;   // skip any unstable intro frames
        const LOOP_END = 8.8;   // stop before any bad end section

        let looping = false;

        function loopCheck() {
            if (!video.duration) {
                requestAnimationFrame(loopCheck);
                return;
            }

            // When we reach end of safe zone, jump back instantly
            if (video.currentTime >= LOOP_END) {
                video.currentTime = LOOP_START;
            }

            requestAnimationFrame(loopCheck);
        }

        video.addEventListener("loadedmetadata", async () => {
            try {
                video.currentTime = LOOP_START;
                await video.play();
                loopCheck();
            } catch (e) {
                console.log(e);
            }
        });

        overlay.addEventListener("click", async () => {
            video.muted = false;
            overlay.style.display = "none";

            try {
                await video.play();
            } catch (e) { }
        });
    </script>

</body>

</html>
