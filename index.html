<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <title>Video</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;

            overflow: hidden;
            background: black;

            width: 100vw;
            height: 100vh;
            object-fit: cover;

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video" autoplay muted playsinline loop>
        <source src="BeachWindow.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');

        overlay.addEventListener('click', () => {
            video.muted = false;
            video.play();
            overlay.style.display = 'none';
        });
    </script>

</body>

</html>

</html>
