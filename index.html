<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Video Loop</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;

            opacity: 1;
            transition: opacity 1s linear;
        }

        #video1 {
            z-index: 2;
        }

        #video2 {
            z-index: 1;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 100;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video1" class="video" autoplay muted playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <video id="video2" class="video" muted playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const v1 = document.getElementById("video1");
        const v2 = document.getElementById("video2");
        const overlay = document.getElementById("overlay");

        const FADE_DURATION = 1000;
        const CROSSFADE_START = 1.0;

        let active = v1;
        let inactive = v2;
        let transitioning = false;

        async function init() {

            // Pre-buffer second video
            await v2.play();
            v2.pause();
            v2.currentTime = 0;

            // Start first video
            await v1.play();

            loopCheck();
        }

        async function loopCheck() {

            if (
                active.duration &&
                active.duration - active.currentTime <= CROSSFADE_START &&
                !transitioning
            ) {

                transitioning = true;

                inactive.currentTime = 0;
                inactive.muted = active.muted;

                // Put incoming video underneath
                inactive.style.zIndex = 1;
                active.style.zIndex = 2;

                inactive.style.opacity = 1;

                await inactive.play();

                // Wait one render frame
                requestAnimationFrame(() => {

                    // Fade OUT top video only
                    active.style.opacity = 0;

                    setTimeout(() => {

                        // Reset old video
                        active.pause();
                        active.currentTime = 0;
                        active.style.opacity = 1;

                        // Swap
                        [active, inactive] = [inactive, active];

                        transitioning = false;

                    }, FADE_DURATION);

                });
            }

            requestAnimationFrame(loopCheck);
        }

        init();

        overlay.addEventListener("click", async () => {

            v1.muted = false;
            v2.muted = false;

            try {
                await active.play();
            } catch (e) { }

            overlay.style.display = "none";

        });
    </script>

</body>

</html>
