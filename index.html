<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seamless Loop Video</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;
            transition: opacity 0.8s linear;
        }

        #video1 {
            z-index: 2;
            opacity: 1;
        }

        #video2 {
            z-index: 1;
            opacity: 0;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 100;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video1" class="video" muted playsinline preload="auto">
        <source src="BeachWindow.mp4" type="video/mp4">
    </video>

    <video id="video2" class="video" muted playsinline preload="auto">
        <source src="BeachWindow.mp4" type="video/mp4">
    </video>

    <script>
        const v1 = document.getElementById("video1");
        const v2 = document.getElementById("video2");
        const overlay = document.getElementById("overlay");

        const FADE_DURATION = 0.8;

        // 🔥 KEY SETTINGS (THIS FIXES YOUR DARK FLASH)
        const LOOP_END_OFFSET = 0.9; // skip last dark portion (tune this)
        const CROSSFADE_START = 0.8; // how early fade begins

        let active = v1;
        let inactive = v2;
        let switching = false;

        async function init() {

            // preload second video
            await v2.play();
            v2.pause();
            v2.currentTime = 0;

            await v1.play();

            requestAnimationFrame(loop);
        }

        async function loop() {

            if (!active.duration) {
                requestAnimationFrame(loop);
                return;
            }

            const timeLeft = active.duration - active.currentTime;

            // start transition EARLY (before dark frames)
            if (timeLeft <= (CROSSFADE_START + LOOP_END_OFFSET) && !switching) {

                switching = true;

                // reset and sync next video
                inactive.currentTime = 0;
                inactive.muted = active.muted;

                await inactive.play();

                // ensure both frames are rendered before fade
                requestAnimationFrame(() => {

                    inactive.style.opacity = 1;

                    setTimeout(() => {

                        active.style.opacity = 0;

                        setTimeout(() => {

                            active.pause();
                            active.currentTime = 0;

                            // swap roles
                            [active, inactive] = [inactive, active];

                            active.style.opacity = 1;

                            switching = false;

                        }, FADE_DURATION * 1000);

                    }, 50);

                });
            }

            requestAnimationFrame(loop);
        }

        init();

        overlay.addEventListener("click", async () => {
            v1.muted = false;
            v2.muted = false;
            overlay.style.display = "none";
        });
    </script>

</body>

</html>
