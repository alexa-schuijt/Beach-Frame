<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;
            transition: opacity 1s linear;
        }

        #video1 {
            opacity: 1;
            z-index: 1;
        }

        #video2 {
            opacity: 0;
            z-index: 2;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video1" class="video" autoplay muted playsinline webkit-playsinline preload="auto">
        <source src="BeachWindow.mp4" type="video/mp4">
    </video>

    <video id="video2" class="video" muted playsinline webkit-playsinline preload="auto">
        <source src="BeachWindow.mp4" type="video/mp4">
    </video>

    <script>
        const overlay = document.getElementById("overlay");

        const v1 = document.getElementById("video1");
        const v2 = document.getElementById("video2");

        const FADE_DURATION = 1.0;

        let active = v1;
        let inactive = v2;

        async function startVideos() {
            try {
                await active.play();
                requestAnimationFrame(checkLoop);
            } catch (e) { }
        }

        function checkLoop() {
            const timeLeft = active.duration - active.currentTime;

            if (timeLeft <= FADE_DURATION && inactive.paused) {
                inactive.currentTime = 0;

                inactive.muted = active.muted;

                inactive.play();

                inactive.style.opacity = 1;
                active.style.opacity = 0;

                [active, inactive] = [inactive, active];

                setTimeout(() => {
                    inactive.pause();
                }, FADE_DURATION * 1000);
            }

            requestAnimationFrame(checkLoop);
        }

        startVideos();

        overlay.addEventListener("click", async () => {
            v1.muted = false;
            v2.muted = false;

            try {
                await active.play();
            } catch (e) { }

            overlay.style.display = "none";
        });
    </script>

</body>

</html>
