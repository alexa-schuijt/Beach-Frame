<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .video {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background: black;
            transition: opacity 1s linear;
        }

        #video1 {
            opacity: 1;
            z-index: 1;
        }

        #video2 {
            opacity: 0;
            z-index: 2;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.2);
            z-index: 10;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <div id="overlay">Tap for Sound</div>

    <video id="video1" class="video" autoplay muted playsinline webkit-playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <video id="video2" class="video" muted playsinline webkit-playsinline preload="auto">
        <source src="video.mp4" type="video/mp4">
    </video>

    <script>
        const overlay = document.getElementById("overlay");

        const v1 = document.getElementById("video1");
        const v2 = document.getElementById("video2");

        const FADE_DURATION = 1.0;
        const PRELOAD_OFFSET = 0.15;

        let active = v1;
        let inactive = v2;
        let transitioning = false;

        async function startVideos() {
            try {

                // Preload second video invisibly
                await v2.play();
                v2.pause();
                v2.currentTime = 0;

                // Start main video
                await v1.play();

                requestAnimationFrame(checkLoop);

            } catch (e) {
                console.log(e);
            }
        }

        async function checkLoop() {

            if (!active.duration) {
                requestAnimationFrame(checkLoop);
                return;
            }

            const timeLeft = active.duration - active.currentTime;

            if (
                timeLeft <= FADE_DURATION + PRELOAD_OFFSET &&
                !transitioning
            ) {

                transitioning = true;

                inactive.currentTime = 0;
                inactive.muted = active.muted;

                try {
                    await inactive.play();
                } catch (e) { }

                // Wait one frame so browser renders first frame
                requestAnimationFrame(() => {

                    // Show next video first
                    inactive.style.opacity = 1;

                    // Tiny overlap prevents dark flash
                    setTimeout(() => {

                        active.style.opacity = 0;

                        setTimeout(() => {

                            active.pause();
                            active.currentTime = 0;

                            // Reset hidden video
                            active.style.opacity = 1;

                            // Swap references
                            [active, inactive] = [inactive, active];

                            transitioning = false;

                        }, FADE_DURATION * 1000);

                    }, 50);

                });
            }

            requestAnimationFrame(checkLoop);
        }

        startVideos();

        overlay.addEventListener("click", async () => {

            v1.muted = false;
            v2.muted = false;

            try {
                await active.play();
            } catch (e) { }

            overlay.style.display = "none";

        });

    </script>

</body>

</html>
